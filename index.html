<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="収集">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>収集</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --card2: #f5f5f4;
  --border: #e4e4e2;
  --text: #1a1a1a;
  --text2: #8c8c8a;
  --accent: #1a1a1a;
  --accent-dim: #f0f0ee;
  --on-accent: #ffffff;
  --red: #d64541;
}
html, body { background: var(--bg); }
html { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none; user-select: none;
}

/* ヘッダー */
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.burger {
  width: 44px; height: 44px; border: none; border-radius: 10px;
  background: var(--card); color: var(--text); font-size: 22px;
  display: grid; place-items: center; cursor: pointer;
}
.head-title { flex: 1; font-size: 15px; color: var(--text2); }
.head-title b { color: var(--text); font-size: 17px; }
.head-day { text-align: right; font-size: 12px; color: var(--text2); line-height: 1.2; }
.head-day b { display: block; font-size: 17px; color: var(--text); }

main { padding: 12px; max-width: 560px; margin: 0 auto; }

/* この台の金額 */
.hero {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 14px 16px 12px; margin-bottom: 10px;
}
.hero-label { font-size: 13px; color: var(--text2); display: flex; justify-content: space-between; }
.hero-amount { font-size: 52px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-top: 2px; }
.hero-amount small { font-size: 22px; font-weight: 700; margin-left: 2px; }
.hero-big { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
/* 最初の画面ではタグを1行に（増えたら横にスクロール） */
.hero .hero-big { flex-wrap: nowrap; overflow-x: auto; }
.hero .tag { flex: none; }
.tag {
  background: var(--accent-dim); color: var(--accent); border-radius: 999px;
  padding: 4px 10px; font-size: 14px; font-weight: 700;
}
.tag.none { background: transparent; color: var(--text2); font-weight: 400; padding-left: 0; }

/* 台の切り替え */
/* 5台までは画面幅に5等分で並べる。6台目からは横にはみ出してスクロール */
.dais { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 24px) / 5); gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
.dai-chip {
  border: 1px solid var(--border); background: var(--card); color: var(--text2);
  border-radius: 10px; padding: 6px 2px; font-size: 13px; cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0;
}
.dai-chip.blank b { color: var(--border); }
.dai-chip b { color: var(--text); font-size: 14px; }
.dai-chip.on { border-color: var(--accent); color: var(--accent); }
.dai-chip.on b { color: var(--accent); }

/* セクション */
section { margin-bottom: 16px; }
h2 { font-size: 14px; color: var(--text2); font-weight: 600; margin: 0 2px 8px; }
.price-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.combo-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 8px; }
.pbtn small, .tbtn .p small, .dai-chip b small { font-size: 0.7em; font-weight: 600; margin-left: 1px; }
.combo-row .pbtn { height: 42px; font-size: 15px; border-radius: 10px; background: var(--card); }

/* 最初の画面はスクロールなし：余った高さはボタンを大きくして埋める */
body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; }
main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 0; }
main .price-row .pbtn { height: 62px; }
main .combo-row .pbtn { height: 52px; }
main .price-row .pbtn { font-size: 21px; }
main .combo-row .pbtn { font-size: 17px; }

/* テンキー */
.pad { margin-top: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
.pad-top { display: flex; gap: 8px; margin-bottom: 8px; }
.pad-disp {
  flex: 1; height: 54px; border-radius: 12px; background: var(--card2);
  display: flex; align-items: center; justify-content: flex-end; padding: 0 14px;
  font-size: 30px; font-weight: 800;
}
.pad-disp small { font-size: 0.55em; font-weight: 600; margin-left: 2px; }
.pad-disp.blank { color: var(--text2); font-weight: 600; }
.pad-add {
  width: 96px; height: 54px; border-radius: 12px; border: none;
  background: var(--accent); color: var(--on-accent); font-size: 26px; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.pad-add:disabled { opacity: 0.3; }
.pad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kbtn {
  height: 50px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 22px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.kbtn.fn { font-size: 16px; color: var(--text2); }
.kbtn.bs { font-size: 24px; color: var(--red); background: #fdecec; border-color: #f5c2c0; }
.kbtn.bs:active { background: var(--red); color: #fff; border-color: var(--red); }
.kbtn:active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pbtn {
  border: 1px solid var(--border); background: var(--card2); color: var(--text);
  border-radius: 12px; height: 54px; font-size: 17px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.item {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px; margin-bottom: 8px;
}
.item-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
.item-name .cnt { color: var(--accent); }
.tiers { display: grid; gap: 6px; }
.item-name:has(span:first-child:empty):has(.cnt:empty) { display: none; }
.tbtn {
  border: 1px solid var(--border); background: var(--card2); color: var(--text);
  border-radius: 10px; padding: 8px 4px; cursor: pointer; font-family: inherit; text-align: center;
}
.tbtn .p { display: block; font-size: 15px; font-weight: 700; padding: 6px 0; }
.block-title { font-size: 18px; font-weight: 800; margin: 24px 2px 10px; padding-top: 14px; border-top: 1px solid var(--border); }

/* 現場ごとのでかぶつ */
.sites { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.sites-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--text2); }
.sites-head b { font-size: 22px; color: var(--text); margin: 0 2px; }
.site { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
.site:first-child { border-top: none; padding-top: 0; }
.site:last-child { padding-bottom: 0; }
.site .no { color: var(--text2); width: 64px; flex: none; }
.hero { position: relative; }
.hero-side { position: absolute; top: 14px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.sites-btn {
  border: 1px solid var(--text); background: var(--card); color: var(--text); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.sites-btn:disabled { border-color: var(--border); color: var(--text2); font-weight: 400; }
.site .bg { flex: 1; font-weight: 600; }
.now { font-size: 13px; color: var(--text2); margin: 0 2px 10px; }
.now b { color: var(--text); }
.tbtn .c { display: block; font-size: 11px; color: var(--text2); margin-top: 2px; }
.pbtn:active, .tbtn:active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tbtn:active .c { color: var(--on-accent); }


/* 下の固定ボタン */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: rgba(255,255,255,0.94); border-top: 1px solid var(--border);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 8px;
}
.bottom > div { flex: 1; display: flex; gap: 8px; max-width: 560px; margin: 0 auto; }
.bbtn {
  height: 56px; border-radius: 14px; border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.bbtn.undo { width: 96px; }
.bbtn.next { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ドロワー（料金表） */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 20; opacity: 0; pointer-events: none; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 21;
  width: min(92vw, 520px); background: var(--bg); border-right: 1px solid var(--border);
  transform: translateX(-100%); transition: transform .22s ease;
  box-shadow: 4px 0 24px rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
}
.drawer.on { transform: none; }
body.lock { overflow: hidden; }
.drawer-head {
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
}
.drawer-head h1 { flex: 1; font-size: 18px; }
.drawer-body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); -webkit-user-select: text; user-select: text; }
.drawer-body h3 { font-size: 15px; margin: 18px 0 8px; color: var(--accent); }
.drawer-body h3:first-child { margin-top: 4px; }
table { width: 100%; max-width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
th { background: var(--card2); color: var(--text2); font-weight: 600; font-size: 12px; text-align: left; padding: 7px 8px; }
td { padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }
td:first-child { white-space: nowrap; }
table.wrap td:first-child { white-space: normal; }
td.yen { white-space: nowrap; font-weight: 700; text-align: right; }
td.g { color: var(--text); font-weight: 700; }
tr.cont td.g { color: transparent; }
tr.cont td { border-top-color: #f0f0ee; }
.note { font-size: 12px; color: var(--text2); margin-top: 6px; line-height: 1.6; }
.menu-btn {
  width: 100%; margin-top: 24px; height: 48px; border-radius: 12px;
  border: 1px solid var(--red); background: transparent; color: var(--red);
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
}

/* 下から出る画面 */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
  transform: translateY(105%); visibility: hidden;
  display: flex; flex-direction: column; max-height: 88vh; max-width: 560px; margin: 0 auto;
}
.sheet.tall { height: 88vh; }
.sheet.on { transform: none; visibility: visible; }
/* 真ん中に出す画面 */
.sheet.center {
  top: 50%; bottom: auto; left: 50%; right: auto; margin: 0;
  width: min(calc(100vw - 32px), 520px); max-height: 80vh;
  border-radius: 20px; transform: translate(-50%, -50%);
}
.sheet.center.on { transform: translate(-50%, -50%); }
.sheet.center .sheet-body { padding: 16px; }
.sheet.center .sites { margin-bottom: 0; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px; }
.sheet-head h1 { flex: 1; font-size: 17px; }
.sheet-head .ok {
  height: 44px; padding: 0 18px; border-radius: 10px; border: none; cursor: pointer;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
}
.sheet-head .ok:disabled { opacity: 0.25; }
.tag.pend { background: transparent; border: 1.5px dashed var(--text); color: var(--text); font-family: inherit; cursor: pointer; }
.sheet-body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 4px 12px calc(16px + env(safe-area-inset-bottom)); }
.sheet .pad { margin-top: 0; border: none; padding: 0; }
.sheet .kbtn { height: 58px; }
#siteBig { margin: 0 2px 12px; }

/* 青＝テンキー、ピンク＝でかぶつ */
.combo-row .pbtn.open-pad { font-size: 14px; border: 2px solid var(--accent); background: var(--accent-dim); }
main .combo-row .pbtn.open-pad { font-size: 16px; }
main .combo-row .pbtn.open-big { font-size: 17px; }
.combo-row .pbtn.open-pad { display: grid; place-items: center; }
.combo-row .pbtn.open-big { grid-column: span 2; font-size: 14px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.open-big .badge { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--on-accent); color: var(--accent); font-size: 12px; line-height: 20px; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--card2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 14px; border-radius: 999px; font-size: 14px; z-index: 30;
  opacity: 0; transition: opacity .15s; pointer-events: none; white-space: nowrap;
}
.toast.on { opacity: 1; }
</style>
</head>
<body>

<header>
  <button class="burger" id="burger" aria-label="料金表">☰</button>
  <div class="head-title" id="headTitle"></div>
  <div class="head-day">今日の合計<b id="dayTotal"></b></div>
</header>

<main>
  <div class="hero">
    <div class="hero-label"><span>この台の容積ポイント</span><span class="hero-side"><span id="heroCount"></span><button class="sites-btn" id="sitesBtn" data-open="sitesSheet"></button></span></div>
    <div class="hero-amount" id="heroAmount"></div>
  </div>

  <div class="dais" id="dais"></div>

  <section>
    <h2>容積ポイント</h2>
    <div class="price-row" id="priceRow"></div>
    <div class="combo-row" id="comboRow"></div>
  </section>
</main>

<div class="bottom"><div>
  <button class="bbtn undo" id="undo">1つ戻す</button>
  <button class="bbtn next" id="next">次の台へ</button>
</div></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h1>料金表</h1>
    <button class="burger" data-close aria-label="閉じる">✕</button>
  </div>
  <div class="drawer-body">
    <div id="drawerBody"></div>
  </div>
</aside>

<!-- 24p以上を打つ画面 -->
<div class="sheet" id="padSheet">
  <div class="sheet-head"><h1>容積ポイントを打つ</h1><button class="burger" data-close aria-label="閉じる">✕</button></div>
  <div class="sheet-body">
    <div class="pad">
      <div class="pad-top">
        <div class="pad-disp" id="padDisp"></div>
        <button class="pad-add" id="padAdd">奠</button>
      </div>
      <div class="pad-keys">
        <button class="kbtn" data-key="1">1</button><button class="kbtn" data-key="2">2</button><button class="kbtn" data-key="3">3</button>
        <button class="kbtn" data-key="4">4</button><button class="kbtn" data-key="5">5</button><button class="kbtn" data-key="6">6</button>
        <button class="kbtn" data-key="7">7</button><button class="kbtn" data-key="8">8</button><button class="kbtn" data-key="9">9</button>
        <button class="kbtn fn" data-key="C">C</button><button class="kbtn" data-key="0">0</button><button class="kbtn bs" data-key="BS" aria-label="1文字消す">⌫</button>
      </div>
    </div>
  </div>
</div>

<!-- でかぶつのある現場の一覧 -->
<div class="sheet center" id="sitesSheet">
  <div class="sheet-body"><div class="sites" id="sites"></div></div>
</div>

<!-- いまの現場のでかぶつ -->
<div class="sheet tall" id="bigSheet">
  <div class="sheet-head"><h1 id="bigTitle"></h1><button class="ok" id="bigOk" aria-label="登録して閉じる"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg></button><button class="burger" data-close aria-label="登録せずに閉じる">✕</button></div>
  <div class="sheet-body">
    <div class="hero-big" id="siteBig"></div>
    <div id="groups"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 品目ボタンの定義 =====
// short は台のタグ表示用の略称。タグは「略称＋ポイント」で出す。
// でかぶつのボタンは数えるだけで、ポイントには足さない（ポイントは上のボタンとテンキーで入れる）
// price は円で持つ（料金表と同じ数字）。画面にはポイントで出す
const PRICES = [400, 900, 1300, 2300, 3200];

const GROUPS = [
  {
    title: 'ベッドマット',
    items: [
      { name: 'ベッドマット', short: 'ベマ', tiers: [
        { price: 1300, cond: '幅120以下' },
        { price: 2300, cond: '幅140以上' },
        { price: 900,  cond: '低反発' },
      ]},
    ],
  },
  {
    title: '箱物（三辺合計）',
    items: [
      { name: '箱物', short: '箱物', tiers: [
        { price: 400,  cond: '〜180' },
        { price: 900,  cond: '180〜' },
        { price: 1300, cond: '225〜' },
        { price: 2300, cond: '315〜' },
        { price: 3200, cond: '405〜' },
      ]},
    ],
  },
  {
    title: 'おおきいもの',
    items: [
      { name: 'ベッド', short: 'ベッド', tiers: [
        { price: 1300, cond: 'シングル' },
        { price: 2300, cond: 'セミダブル〜' },
      ]},
      { name: 'ソファー', short: 'ソファー', tiers: [
        { price: 900,  cond: '幅100未満' },
        { price: 2300, cond: '幅100以上' },
      ]},
      { name: '机', short: '机', tiers: [
        { price: 900,  cond: '袖なし' },
        { price: 1300, cond: '片袖' },
        { price: 3200, cond: '両袖' },
      ]},
      { name: 'テーブル', short: 'テーブル', tiers: [
        { price: 900,  cond: '100以上' },
        { price: 1300, cond: '150以上' },
      ]},
      { name: '自転車', short: '自転車', tiers: [
        { price: 400, cond: '16インチ以下' },
        { price: 900, cond: '18インチ以上' },
      ]},
    ],
  },
];

// ===== 状態 =====
const KEY = 'shuushuu-v1';
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const DAIS = 5; // 最初から並べておく台の数
const newDay = () => ({ date: today(), cur: 0, dais: Array.from({ length: DAIS }, () => []) });

let state;
let pendingBigs = []; // でかぶつ画面で押したけど、まだ☑️していない分
function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.dais)) state = newDay();
  // 日付が変わっていたら新しい日として始める
  if (state.date !== today()) state = newDay();
  while (state.dais.length < DAIS) state.dais.push([]);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const MARU = '①②③④⑤⑥⑦⑧⑨⑩';
const maru = i => MARU[i] || `(${i+1})`;
// 容積ポイント：料金の百円単位（1,300円→13p）。メモの「④216」と同じ数え方
const pt = n => (n / 100).toLocaleString('ja-JP');
const sum = list => list.reduce((a, e) => a + e.price, 0);
const cur = () => state.dais[state.cur];

// ===== 描画 =====
function render() {
  const list = cur();
  const total = sum(list);
  const dayTotal = state.dais.reduce((a, l) => a + sum(l), 0);
  const d = new Date();
  const wd = '日月火水木金土'[d.getDay()];

  document.getElementById('headTitle').innerHTML =
    `<b>${maru(state.cur)}台目</b>　${d.getMonth()+1}/${d.getDate()}(${wd})`;
  document.getElementById('dayTotal').textContent = pt(dayTotal) + 'p';
  document.getElementById('heroAmount').innerHTML = `${pt(total)}<small>p</small>`;
  // 件数はポイントを入れた回数。でかぶつは数えない
  document.getElementById('heroCount').textContent = `${list.filter(e => e.price > 0).length}件`;

  // 台の切り替え
  document.getElementById('dais').innerHTML = state.dais.map((l, i) =>
    `<button class="dai-chip${i === state.cur ? ' on' : ''}${l.length ? '' : ' blank'}" data-dai="${i}">${maru(i)}<b>${pt(sum(l))}<small>p</small></b></button>`
  ).join('');

  // 品目ごとの点数
  document.querySelectorAll('[data-cnt]').forEach(el => {
    const n = list.concat(pendingBigs).filter(e => e.name === el.dataset.cnt).length;
    el.textContent = n ? `${n}点` : '';
  });

  // 現場ごとのでかぶつ
  // 現場の番号（何箇所目か）は、でかぶつの無い現場も含めて数える。まとめるのは同じ現場の中だけ
  const ss = sites(list), withBig = ss.map((x, i) => ({ ...x, no: i + 1 })).filter(x => x.bigs.size);
  const sb = document.getElementById('sitesBtn');
  sb.textContent = `でかぶつ${withBig.length}箇所`;
  sb.disabled = !withBig.length;
  document.getElementById('sites').innerHTML = withBig.map(x =>
    `<div class="site"><span class="no">${x.no}箇所目</span><span class="bg">${
      [...x.labels].map(([k, n]) => k + (n > 1 ? `×${n}` : '')).join('、')
    }</span></div>`).join('');
  // ピンクのボタンとでかぶつ画面：いまの現場（最後にポイントを入れた現場）
  const last = ss[ss.length - 1];
  const lastBigs = last ? [...last.bigs] : [];
  const lastN = lastBigs.reduce((a, [, n]) => a + n, 0);
  document.getElementById('bigBadge').textContent = lastN || '';
  document.getElementById('bigBadge').style.display = lastN ? '' : 'none';
  document.getElementById('bigTitle').textContent = last
    ? `${ss.length}現場目${last.pts ? `（${pt(last.pts)}p）` : ''}のでかぶつ`
    : 'でかぶつ（先にポイントを入れると現場が始まる）';
  // 登録済みは塗り、☑️待ちは枠だけ（押すと取り消し）
  document.getElementById('siteBig').innerHTML = (lastBigs.length || pendingBigs.length)
    ? lastBigs.map(([k, n]) => `<span class="tag">${k}${n > 1 ? '×' + n : ''}</span>`).join('') +
      pendingBigs.map((e, i) => `<button class="tag pend" data-unpend="${i}">${e.short} ${e.cond} ✕</button>`).join('')
    : '<span class="tag none">この現場はまだ無し</span>';
  document.getElementById('bigOk').disabled = !pendingBigs.length;

  document.getElementById('undo').disabled = !list.length;
}

// 1行目のポイントを2つ以上組み合わせて作れる合計（max以下）。8, 12, 13, 16, 17 …
function comboPoints(max) {
  const base = PRICES.map(p => p / 100);
  // reach[n] = n を作るのに要る最少の個数（作れなければ Infinity）
  const reach = Array(max + 1).fill(Infinity); reach[0] = 0;
  const two = new Set();
  for (let n = 1; n <= max; n++) for (const b of base) if (b <= n && reach[n - b] < Infinity) {
    reach[n] = Math.min(reach[n], reach[n - b] + 1);
    if (reach[n - b] >= 1) two.add(n); // 2個以上で作れる
  }
  return [...two].sort((a, b) => a - b);
}

// ポイントを入れるたびに新しい現場。でかぶつは直前の現場に入る（ポイントより先に押した分は、それだけで1現場）
function sites(list) {
  const out = [];
  for (const e of list) {
    if (e.price > 0 || !out.length) out.push({ pts: 0, bigs: new Map(), labels: new Map() });
    const x = out[out.length - 1];
    x.pts += e.price;
    if (e.short) {
      const k = `${e.short.split(' ')[0]} ${e.cond}`; x.bigs.set(k, (x.bigs.get(k) || 0) + 1);
      const l = bigLabel(e); x.labels.set(l, (x.labels.get(l) || 0) + 1);
    }
  }
  return out;
}

// 一覧用の書き方：「900円テーブル」。料金は品目ボタンの定義から引く
function bigLabel(e) {
  let yenv = e.price;
  for (const g of GROUPS) for (const it of g.items) if (it.name === e.name)
    for (const t of it.tiers) if (t.cond === e.cond) yenv = t.price;
  const name = e.cond === '低反発' ? '低反発ベッドマット' : e.name;
  return yenv ? `${yenv.toLocaleString('ja-JP')}円${name}` : name;
}

function buildButtons() {
  document.getElementById('priceRow').innerHTML = PRICES.map(p =>
    `<button class="pbtn" data-price="${p}">${pt(p)}<small>p</small></button>`).join('');
  // 41pまでボタンで出す（6列×5行の最後に、テンキー1マスとでかぶつ2マスがちょうど収まる）。42p から先はテンキー
  document.getElementById('comboRow').innerHTML = comboPoints(41).map(n =>
    `<button class="pbtn" data-price="${n * 100}">${n}<small>p</small></button>`).join('') +
    '<button class="pbtn open-pad" data-open="padSheet" aria-label="テンキー"><svg viewBox="0 0 24 26" width="22" height="24" fill="currentColor"><circle cx="6" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="6" cy="11" r="2"/><circle cx="12" cy="11" r="2"/><circle cx="18" cy="11" r="2"/><circle cx="6" cy="17" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><circle cx="12" cy="23" r="2"/></svg></button>' +
    '<button class="pbtn open-big" data-open="bigSheet">でかぶつ<span class="badge" id="bigBadge"></span></button>';

  document.getElementById('groups').innerHTML = GROUPS.map((g, gi) =>
    `<section><h2>${g.title}</h2>${g.items.map((it, ii) =>
      `<div class="item">
        <div class="item-name"><span>${g.items.length > 1 ? it.name : ''}</span><span class="cnt" data-cnt="${it.name}"></span></div>
        <div class="tiers" style="grid-template-columns:repeat(${it.tiers.length},1fr)">${it.tiers.map((t, ti) =>
          `<button class="tbtn" data-tier="${gi}-${ii}-${ti}"><span class="p">${t.cond}</span></button>`
        ).join('')}</div>
      </div>`).join('')}</section>`
  ).join('');
}

// ===== 操作 =====
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1200);
}
function buzz() { if (navigator.vibrate) navigator.vibrate(15); }

function add(entry) {
  if (state.date !== today()) { state = newDay(); }
  cur().push(entry);
  save(); render(); buzz();
  toast(entry.big ? `${entry.name} ${entry.cond} ＋1` : `+${pt(entry.price)}p`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-close')) {
    closeAll();
  } else if (b.dataset.open) {
    openPanel(b.dataset.open);
  } else if (b.dataset.key) {
    padPress(b.dataset.key);
  } else if (b.dataset.price) {
    add({ price: +b.dataset.price });
  } else if (b.dataset.tier) {
    const [gi, ii, ti] = b.dataset.tier.split('-').map(Number);
    const it = GROUPS[gi].items[ii], t = it.tiers[ti];
    // でかぶつ画面では、☑️を押すまで登録しない
    pendingBigs.push({ price: 0, big: true, name: it.name, cond: t.cond, short: it.short });
    render(); buzz();
  } else if (b.dataset.unpend != null) {
    pendingBigs.splice(+b.dataset.unpend, 1);
    render();
  } else if (b.dataset.dai != null) {
    state.cur = +b.dataset.dai;
    save(); render();
  }
});

// ===== テンキー =====
let padVal = '';
function renderPad() {
  const d = document.getElementById('padDisp');
  d.className = 'pad-disp' + (padVal ? '' : ' blank');
  d.innerHTML = padVal ? `${padVal}<small>p</small>` : '0<small>p</small>';
  document.getElementById('padAdd').disabled = !+padVal;
}
function padPress(k) {
  if (k === 'C') padVal = '';
  else if (k === 'BS') padVal = padVal.slice(0, -1);
  else if (padVal.length < 3) padVal = (padVal + k).replace(/^0+/, '');
  renderPad();
}
document.getElementById('padAdd').onclick = () => {
  const n = +padVal;
  if (!n) return;
  padVal = ''; renderPad();
  add({ price: n * 100 });
  closeAll();
};

document.getElementById('undo').onclick = () => {
  const e = cur().pop();
  if (!e) return;
  save(); render();
  toast(e.big ? `${e.name} 取り消し` : `−${pt(e.price)}p 取り消し`);
};

document.getElementById('next').onclick = () => {
  if (!cur().length) { toast('この台はまだ空だよ'); return; }
  // ひとつ先の台へ。5台目より先は台を足す
  if (state.cur === state.dais.length - 1) state.dais.push([]);
  state.cur++;
  save(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
