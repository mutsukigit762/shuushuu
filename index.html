<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="収集">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>収集</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --card2: #f5f5f4;
  --border: #e4e4e2;
  --text: #1a1a1a;
  --text2: #8c8c8a;
  --accent: #1a1a1a;
  --accent-dim: #f0f0ee;
  --on-accent: #ffffff;
  --red: #d64541;
}
html, body { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none; user-select: none;
}

/* ヘッダー */
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.burger {
  width: 44px; height: 44px; border: none; border-radius: 10px;
  background: var(--card); color: var(--text); font-size: 22px;
  display: grid; place-items: center; cursor: pointer;
}
.head-title { flex: 1; font-size: 15px; color: var(--text2); }
.head-title b { color: var(--text); font-size: 17px; }
.head-day { text-align: right; font-size: 12px; color: var(--text2); line-height: 1.2; }
.head-day b { display: block; font-size: 17px; color: var(--text); }

main { padding: 12px; max-width: 560px; margin: 0 auto; }

/* この台の金額 */
.hero {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 14px 16px 12px; margin-bottom: 10px;
}
.hero-label { font-size: 13px; color: var(--text2); display: flex; justify-content: space-between; }
.hero-amount { font-size: 52px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-top: 2px; }
.hero-amount small { font-size: 22px; font-weight: 700; margin-left: 2px; }
.hero-big { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.tag {
  background: var(--accent-dim); color: var(--accent); border-radius: 999px;
  padding: 4px 10px; font-size: 14px; font-weight: 700;
}
.tag.none { background: transparent; color: var(--text2); font-weight: 400; padding-left: 0; }

/* 台の切り替え */
.dais { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
.dai-chip {
  flex: none; border: 1px solid var(--border); background: var(--card); color: var(--text2);
  border-radius: 10px; padding: 6px 10px; font-size: 14px; cursor: pointer; font-family: inherit;
}
.dai-chip b { color: var(--text); margin-left: 4px; }
.dai-chip.on { border-color: var(--accent); color: var(--accent); }
.dai-chip.on b { color: var(--accent); }

/* セクション */
section { margin-bottom: 16px; }
h2 { font-size: 14px; color: var(--text2); font-weight: 600; margin: 0 2px 8px; }
.price-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pbtn {
  border: 1px solid var(--border); background: var(--card2); color: var(--text);
  border-radius: 12px; height: 54px; font-size: 17px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.item {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px; margin-bottom: 8px;
}
.item-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
.item-name .cnt { color: var(--accent); }
.tiers { display: grid; gap: 6px; }
.item-name:has(span:first-child:empty):has(.cnt:empty) { display: none; }
.tbtn {
  border: 1px solid var(--border); background: var(--card2); color: var(--text);
  border-radius: 10px; padding: 8px 4px; cursor: pointer; font-family: inherit; text-align: center;
}
.tbtn .p { display: block; font-size: 17px; font-weight: 700; }
.tbtn .c { display: block; font-size: 11px; color: var(--text2); margin-top: 2px; }
.pbtn:active, .tbtn:active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tbtn:active .c { color: var(--on-accent); }

/* 積んだもの */
.log { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.log-row { display: flex; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); font-size: 15px; }
.log-row:first-child { border-top: none; }
.log-row .n { flex: 1; color: var(--text2); }
.log-row .n b { color: var(--text); font-weight: 600; }
.log-row .y { font-weight: 700; margin-right: 10px; }
.del {
  width: 34px; height: 34px; border-radius: 8px; border: none; background: var(--card2);
  color: var(--text2); font-size: 16px; cursor: pointer;
}
.empty { padding: 14px; color: var(--text2); font-size: 14px; text-align: center; }

/* 下の固定ボタン */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: rgba(255,255,255,0.94); border-top: 1px solid var(--border);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 8px;
}
.bottom > div { flex: 1; display: flex; gap: 8px; max-width: 560px; margin: 0 auto; }
.bbtn {
  height: 56px; border-radius: 14px; border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.bbtn.undo { width: 96px; }
.bbtn.next { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ドロワー（料金表） */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 21;
  width: min(92vw, 520px); background: var(--bg); border-right: 1px solid var(--border);
  transform: translateX(-100%); transition: transform .22s ease;
  box-shadow: 4px 0 24px rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
}
.drawer.on { transform: none; }
body.lock { overflow: hidden; }
.drawer-head {
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
}
.drawer-head h1 { flex: 1; font-size: 18px; }
.drawer-body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); -webkit-user-select: text; user-select: text; }
.drawer-body h3 { font-size: 15px; margin: 18px 0 8px; color: var(--accent); }
.drawer-body h3:first-child { margin-top: 4px; }
table { width: 100%; max-width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
th { background: var(--card2); color: var(--text2); font-weight: 600; font-size: 12px; text-align: left; padding: 7px 8px; }
td { padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }
td:first-child { white-space: nowrap; }
table.wrap td:first-child { white-space: normal; }
td.yen { white-space: nowrap; font-weight: 700; text-align: right; }
td.g { color: var(--text); font-weight: 700; }
tr.cont td.g { color: transparent; }
tr.cont td { border-top-color: #f0f0ee; }
.note { font-size: 12px; color: var(--text2); margin-top: 6px; line-height: 1.6; }
.menu-btn {
  width: 100%; margin-top: 24px; height: 48px; border-radius: 12px;
  border: 1px solid var(--red); background: transparent; color: var(--red);
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
}

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--card2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 14px; border-radius: 999px; font-size: 14px; z-index: 30;
  opacity: 0; transition: opacity .15s; pointer-events: none; white-space: nowrap;
}
.toast.on { opacity: 1; }
</style>
</head>
<body>

<header>
  <button class="burger" id="burger" aria-label="料金表">☰</button>
  <div class="head-title" id="headTitle"></div>
  <div class="head-day">今日の合計<b id="dayTotal"></b></div>
</header>

<main>
  <div class="hero">
    <div class="hero-label"><span>この台の金額</span><span id="heroCount"></span></div>
    <div class="hero-amount" id="heroAmount"></div>
    <div class="hero-big" id="heroBig"></div>
  </div>

  <div class="dais" id="dais"></div>

  <section>
    <h2>金額だけ足す</h2>
    <div class="price-row" id="priceRow"></div>
  </section>

  <div id="groups"></div>

  <section>
    <h2>この台に積んだもの</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<div class="bottom"><div>
  <button class="bbtn undo" id="undo">1つ戻す</button>
  <button class="bbtn next" id="next">次の台へ</button>
</div></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h1>料金表</h1>
    <button class="burger" id="closeDrawer" aria-label="閉じる">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
// ===== 品目ボタンの定義 =====
// short は台のタグ表示用の略称。タグは「略称＋金額」で出す。
const PRICES = [400, 900, 1300, 2300, 3200];

const GROUPS = [
  {
    title: 'ベッドマット',
    items: [
      { name: 'ベッドマット', short: 'ベマ', tiers: [
        { price: 1300, cond: '幅120以下' },
        { price: 2300, cond: '幅140以上' },
        { price: 900,  cond: '低反発' },
      ]},
    ],
  },
  {
    title: '箱物（三辺合計）',
    items: [
      { name: '箱物', short: '箱物', tiers: [
        { price: 400,  cond: '180未満' },
        { price: 900,  cond: '180〜' },
        { price: 1300, cond: '225〜' },
        { price: 2300, cond: '315〜' },
        { price: 3200, cond: '405〜' },
      ]},
    ],
  },
  {
    title: 'おおきいもの',
    items: [
      { name: 'ベッド', short: 'ベッド', tiers: [
        { price: 1300, cond: 'シングル' },
        { price: 2300, cond: 'セミダブル〜' },
      ]},
      { name: 'ソファー', short: 'ソファー', tiers: [
        { price: 900,  cond: '幅100未満' },
        { price: 2300, cond: '幅100以上' },
      ]},
      { name: '机', short: '机', tiers: [
        { price: 900,  cond: '袖なし' },
        { price: 1300, cond: '片袖' },
        { price: 3200, cond: '両袖' },
      ]},
      { name: 'テーブル', short: 'テーブル', tiers: [
        { price: 900,  cond: '100以上' },
        { price: 1300, cond: '150以上' },
      ]},
      { name: '自転車', short: '自転車', tiers: [
        { price: 400, cond: '16インチ以下' },
        { price: 900, cond: '18インチ以上' },
      ]},
    ],
  },
];

// ===== 状態 =====
const KEY = 'shuushuu-v1';
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const newDay = () => ({ date: today(), cur: 0, dais: [[]] });

let state;
function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.dais)) state = newDay();
  // 日付が変わっていたら新しい日として始める
  if (state.date !== today()) state = newDay();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const MARU = '①②③④⑤⑥⑦⑧⑨⑩';
const maru = i => MARU[i] || `(${i+1})`;
const yen = n => n.toLocaleString('ja-JP');
const sum = list => list.reduce((a, e) => a + e.price, 0);
const cur = () => state.dais[state.cur];

// ===== 描画 =====
function render() {
  const list = cur();
  const total = sum(list);
  const dayTotal = state.dais.reduce((a, l) => a + sum(l), 0);
  const d = new Date();
  const wd = '日月火水木金土'[d.getDay()];

  document.getElementById('headTitle').innerHTML =
    `<b>${maru(state.cur)}台目</b>　${d.getMonth()+1}/${d.getDate()}(${wd})`;
  document.getElementById('dayTotal').textContent = yen(dayTotal) + '円';
  document.getElementById('heroAmount').innerHTML = `${yen(total)}<small>円</small>`;
  document.getElementById('heroCount').textContent = `${list.length}点`;

  // おおきいもの・箱物・ベマのタグ（メモの下の行にあたる）
  const counts = new Map();
  list.forEach(e => { if (e.short) counts.set(e.short, (counts.get(e.short) || 0) + 1); });
  const big = document.getElementById('heroBig');
  big.innerHTML = counts.size
    ? [...counts].map(([s, n]) => `<span class="tag">${s}${n > 1 ? '×' + n : ''}</span>`).join('')
    : '<span class="tag none">おおきいものはまだ無し</span>';

  // 台の切り替え
  document.getElementById('dais').innerHTML = state.dais.map((l, i) =>
    `<button class="dai-chip${i === state.cur ? ' on' : ''}" data-dai="${i}">${maru(i)}<b>${yen(sum(l))}</b></button>`
  ).join('');

  // 品目ごとの点数
  document.querySelectorAll('[data-cnt]').forEach(el => {
    const n = list.filter(e => e.name === el.dataset.cnt).length;
    el.textContent = n ? `${n}点` : '';
  });

  // 積んだもの（新しい順）
  const log = document.getElementById('log');
  log.innerHTML = list.length
    ? list.map((e, i) => ({ e, i })).reverse().map(({ e, i }) =>
        `<div class="log-row">
          <span class="n">${e.name ? `<b>${e.name}</b>　${e.cond}` : '金額のみ'}</span>
          <span class="y">${yen(e.price)}円</span>
          <button class="del" data-del="${i}" aria-label="消す">✕</button>
        </div>`).join('')
    : '<div class="empty">まだ何も積んでない</div>';

  document.getElementById('undo').disabled = !list.length;
}

function buildButtons() {
  document.getElementById('priceRow').innerHTML = PRICES.map(p =>
    `<button class="pbtn" data-price="${p}">${yen(p)}</button>`).join('');

  document.getElementById('groups').innerHTML = GROUPS.map((g, gi) =>
    `<section><h2>${g.title}</h2>${g.items.map((it, ii) =>
      `<div class="item">
        <div class="item-name"><span>${g.items.length > 1 ? it.name : ''}</span><span class="cnt" data-cnt="${it.name}"></span></div>
        <div class="tiers" style="grid-template-columns:repeat(${it.tiers.length},1fr)">${it.tiers.map((t, ti) =>
          `<button class="tbtn" data-tier="${gi}-${ii}-${ti}"><span class="p">${yen(t.price)}</span><span class="c">${t.cond}</span></button>`
        ).join('')}</div>
      </div>`).join('')}</section>`
  ).join('');
}

// ===== 操作 =====
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1200);
}
function buzz() { if (navigator.vibrate) navigator.vibrate(15); }

function add(entry) {
  if (state.date !== today()) { state = newDay(); }
  cur().push(entry);
  save(); render(); buzz();
  toast(`${entry.name ? entry.name + ' ' : ''}+${yen(entry.price)}円`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.price) {
    add({ price: +b.dataset.price });
  } else if (b.dataset.tier) {
    const [gi, ii, ti] = b.dataset.tier.split('-').map(Number);
    const it = GROUPS[gi].items[ii], t = it.tiers[ti];
    add({ price: t.price, name: it.name, cond: t.cond, short: `${it.short} ${yen(t.price)}` });
  } else if (b.dataset.del != null) {
    cur().splice(+b.dataset.del, 1);
    save(); render();
  } else if (b.dataset.dai != null) {
    state.cur = +b.dataset.dai;
    save(); render();
  }
});

document.getElementById('undo').onclick = () => {
  const e = cur().pop();
  if (!e) return;
  save(); render();
  toast(`−${yen(e.price)}円 取り消し`);
};

document.getElementById('next').onclick = () => {
  if (!cur().length) { toast('この台はまだ空だよ'); return; }
  // 末尾の台にいる時だけ新しい台を足す。前の台を見ている時は一番新しい台へ戻る
  const last = state.dais.length - 1;
  if (state.cur === last) state.dais.push([]);
  state.cur = state.dais.length - 1;
  save(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// ===== 料金表（マニュアル p.6〜9 と束品目一覧から） =====
const TABLES = `
<h3>重さの目安と料金</h3>
<table>
<tr><th>標準重量</th><th style="text-align:right">料金</th><th>例</th></tr>
<tr><td>10kgまで</td><td class="yen">400円</td><td>布団、スーツケース、扇風機</td></tr>
<tr><td>20kgまで</td><td class="yen">900円</td><td>卓上ミシン、オイルヒーター</td></tr>
<tr><td>30kgまで</td><td class="yen">1,300円</td><td>シングルベッド、食洗機</td></tr>
<tr><td>50kgまで</td><td class="yen">2,300円</td><td>ダブルベッド、ランニングマシーン</td></tr>
<tr><td>70kgまで</td><td class="yen">3,200円</td><td>オルガン、電子ピアノ</td></tr>
</table>

<h3>サイズ・重さで変わるもの</h3>
<table>
<tr><th>品目</th><th style="text-align:right">料金</th><th>条件</th></tr>
<tr><td class="g">自転車</td><td class="yen">400円</td><td>16インチ以下</td></tr>
<tr class="cont"><td class="g">自転車</td><td class="yen">900円</td><td>18インチ以上</td></tr>
<tr><td class="g">テーブル</td><td class="yen">400円</td><td>最大辺 100cm未満</td></tr>
<tr class="cont"><td class="g">テーブル</td><td class="yen">900円</td><td>最大辺 100cm以上</td></tr>
<tr class="cont"><td class="g">テーブル</td><td class="yen">1,300円</td><td>最大辺 150cm以上</td></tr>
<tr><td class="g">箱物系</td><td class="yen">400円</td><td>三辺合計 180cm未満</td></tr>
<tr class="cont"><td class="g">箱物系</td><td class="yen">900円</td><td>三辺合計 180cm以上</td></tr>
<tr class="cont"><td class="g">箱物系</td><td class="yen">1,300円</td><td>三辺合計 225cm以上</td></tr>
<tr class="cont"><td class="g">箱物系</td><td class="yen">2,300円</td><td>三辺合計 315cm以上</td></tr>
<tr class="cont"><td class="g">箱物系</td><td class="yen">3,200円</td><td>三辺合計 405cm以上</td></tr>
<tr><td class="g">ベッドマット</td><td class="yen">1,300円</td><td>幅 120cm以下（セミシングル〜セミダブル）</td></tr>
<tr class="cont"><td class="g">ベッドマット</td><td class="yen">2,300円</td><td>幅 140cm以上（ダブル〜キング）</td></tr>
<tr><td class="g">ソファー</td><td class="yen">900円</td><td>幅 100cm未満（一人用扱い）</td></tr>
<tr class="cont"><td class="g">ソファー</td><td class="yen">2,300円</td><td>幅 100cm以上（二人用以上扱い）</td></tr>
<tr><td class="g">プリンター</td><td class="yen">400円</td><td>10kg以下（単機能）</td></tr>
<tr class="cont"><td class="g">プリンター</td><td class="yen">900円</td><td>10kg超</td></tr>
<tr><td class="g">コピー機</td><td class="yen">400円</td><td>10kg以下（複合機）</td></tr>

const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
document.getElementById('drawerBody').innerHTML = TABLES;
const openDrawer = () => { drawer.classList.add('on'); scrim.classList.add('on'); document.body.classList.add('lock'); };
const closeDrawer = () => { drawer.classList.remove('on'); scrim.classList.remove('on'); document.body.classList.remove('lock'); };
document.getElementById('burger').onclick = openDrawer;
document.getElementById('closeDrawer').onclick = closeDrawer;
scrim.onclick = closeDrawer;
document.getElementById('resetDay').onclick = () => {
  if (!confirm('今日の台をぜんぶ消す？')) return;
  state = newDay(); save(); render(); closeDrawer();
};

// アプリに戻ってきた時に日付をまたいでいたら新しい日にする
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.date !== today()) { state = newDay(); save(); render(); }
});

load();
buildButtons();
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
